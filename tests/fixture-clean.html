<!DOCTYPE html>
<!-- deck-studio 契约验证 fixture（干净版·舞台架构 v3 双模式）：应通过溢出门禁（退出码 0）与 e2e 真实交互测试。
     契约要素：deck-stage>deck-fit 舞台 / body.browse 无缝长页滚动（默认）/ body.presenting 单页节拍 /
     section.slide[data-label] 1920×1080 / .reveal 步进 / 播放器杂物类名 / token 色板 / 根文档零滚动零 IO。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>deck-studio fixture · 干净版</title>
<style>
  :root {
    --c-info: #3b82f6; --c-exec: #2563eb; --c-guard: #60a5fa;
    --bg-card: #f8fafc; --border-card: #e2e8f0; --bg-block: #f1f5f9;
    --text: #1e293b; --text-sub: #64748b; --text-faint: #94a3b8;
    --c-pass: #1d4ed8;
    --ease-out-expo: cubic-bezier(.16,1,.3,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #e8eaf0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); }
  .deck-stage { position: fixed; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .deck-fit { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden;
    background: #fff; box-shadow: 0 12px 48px rgba(15,23,42,.18); border-radius: 8px; }
  .slide { width: 1920px; height: 1080px; padding: 56px 90px; display: flex; flex-direction: column;
    overflow: hidden; background: #fff; flex: 0 0 auto; }
  .reveal { transition: opacity .5s var(--ease-out-expo), transform .5s var(--ease-out-expo); }
  body.presenting .slide.current .reveal:not(.shown) { opacity: 0 !important; transform: translateY(18px) !important; }
  body:not(.browse) .deck-fit { transform-origin: center center; }
  body:not(.browse) .slide { position: absolute; inset: 0; visibility: hidden; opacity: 0;
    transition: opacity .35s ease, visibility 0s linear .35s; }
  body:not(.browse) .slide.current { visibility: visible; opacity: 1; transition: opacity .35s ease; }
  body.browse .deck-stage { display: block; overflow-y: auto; overflow-x: hidden; padding: 16px 0 40px; }
  body.browse .deck-fit { height: auto; transform-origin: top left; box-shadow: none; border-radius: 0; background: transparent; }
  body.browse .slide { position: relative; margin-bottom: 24px; border-radius: 8px; box-shadow: 0 10px 32px rgba(15,23,42,.12); }
  .eyebrow { font-family: ui-monospace, monospace; font-size: 18px; letter-spacing: .2em; color: var(--c-exec); margin-bottom: 10px; }
  h1 { font-size: 76px; font-weight: 800; line-height: 1.15; }
  h3 { font-size: 46px; font-weight: 600; letter-spacing: -.02em; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 32px; flex: 1; min-height: 0; }
  .card { background: #fff; border: 1px solid #d5d9de; border-radius: 14px; padding: 24px; overflow: hidden; }
  .card h4 { font-size: 24px; font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid #e1e4e7; }
  .card p { font-size: 21px; color: var(--text-sub); line-height: 1.45; margin-top: 14px; }
  .key { color: var(--c-pass); font-weight: 700; }
  /* ===== 液态玻璃 chrome（材质 token：暗色预设整体覆盖 --glass-* 即可） ===== */
  :root {
    --glass-bg: rgba(255,255,255,.58);
    --glass-bg-strong: rgba(248,250,252,.84);
    --glass-border: rgba(255,255,255,.65);
    --glass-rim: inset 0 1px 0 rgba(255,255,255,.75), inset 0 0 0 .5px rgba(255,255,255,.35), inset 0 -1px 0 rgba(15,23,42,.05);
    --glass-shadow: 0 8px 32px rgba(15,23,42,.14), 0 2px 8px rgba(15,23,42,.06);
    --glass-blur: saturate(180%) blur(20px);
    --glass-spring: cubic-bezier(.34,1.56,.64,1);
  }
  .deck-progress { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: min(42vw, 420px); height: 6px;
    z-index: 100; border-radius: 999px; background: rgba(15,23,42,.08); border: 1px solid var(--glass-border);
    box-shadow: var(--glass-rim); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); overflow: hidden; }
  #progressBar { height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--c-info), var(--c-exec));
    box-shadow: 0 0 12px rgba(59,130,246,.55); transition: width .4s var(--glass-spring); }
  /* 单一 chrome 聚合（左上角）：☰ 目录 + 页码 + 放映；玻璃材质 + 顶面高光 + 弹簧微交互 */
  .deck-bar { position: fixed; top: 14px; left: 16px; z-index: 110; display: flex; align-items: center; gap: 4px;
    border-radius: 999px; padding: 6px 8px; font-size: 13px; color: var(--text-sub, #64748b);
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-rim), var(--glass-shadow);
    transition: transform .45s var(--glass-spring), opacity .4s ease; }
  .deck-bar:hover { transform: translateY(-1px); }
  .deck-bar::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.08) 30%, transparent 55%); }
  .deck-page { font-variant-numeric: tabular-nums; letter-spacing: .06em; padding: 0 6px; }
  .deck-menu { border: none; background: transparent; cursor: pointer; font-size: 15px; line-height: 1;
    color: var(--text-sub, #64748b); padding: 4px 9px; border-radius: 999px;
    transition: transform .25s var(--glass-spring), background .2s ease; }
  .deck-menu:hover { background: rgba(37,99,235,.1); transform: scale(1.06); }
  .deck-menu:active { transform: scale(.94); }
  .deck-present-btn { border: 1px solid rgba(255,255,255,.35); cursor: pointer; border-radius: 999px; padding: 6px 14px;
    font-size: 13px; font-weight: 600; color: #fff;
    background: linear-gradient(180deg, rgba(59,130,246,.92), rgba(37,99,235,.92));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 10px rgba(37,99,235,.35);
    transition: transform .25s var(--glass-spring), filter .2s ease; }
  .deck-present-btn:hover { filter: brightness(1.07); transform: scale(1.04); }
  .deck-present-btn:active { transform: scale(.96); }
  .deck-menu:focus-visible, .deck-present-btn:focus-visible { outline: 2px solid var(--c-info, #3b82f6); outline-offset: 2px; }

  .deck-sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 200; width: 320px;
    display: flex; flex-direction: column;
    background: var(--glass-bg-strong); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border-right: 1px solid var(--glass-border);
    transform: translateX(-100%); transition: transform .4s var(--ease-out-expo, cubic-bezier(.16,1,.3,1)); }
  .deck-sidebar.open { transform: none; }
  .deck-sidebar::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.35) 0%, transparent 30%); }
  .deck-sidebar-head { position: relative; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; font-size: 15px; font-weight: 700; color: var(--text, #1e293b);
    border-bottom: 1px solid rgba(15,23,42,.06); }
  .deck-sidebar-close { border: none; background: transparent; font-size: 20px; cursor: pointer;
    color: var(--text-faint, #94a3b8); line-height: 1; border-radius: 999px; padding: 2px 8px;
    transition: background .2s ease, transform .25s var(--glass-spring); }
  .deck-sidebar-close:hover { background: rgba(15,23,42,.06); transform: scale(1.1); }
  .deck-thumbs { position: relative; flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .thumb-item { cursor: pointer; border: 2px solid transparent; border-radius: 12px;
    transition: transform .25s var(--glass-spring), border-color .2s ease; }
  .thumb-item:hover { transform: scale(1.02); }
  .thumb-item.active { border-color: var(--c-exec, #2563eb); }
  .thumb-box { width: 100%; height: 162px; overflow: hidden; border-radius: 10px; position: relative; background: #fff;
    border: 1px solid rgba(255,255,255,.6); box-shadow: 0 2px 10px rgba(15,23,42,.08), inset 0 1px 0 rgba(255,255,255,.6); }
  .thumb-inner { width: 1920px; height: 1080px; transform: scale(0.15); transform-origin: top left; position: relative; }
  .thumb-page { position: absolute !important; inset: 0 !important; width: 1920px !important; height: 1080px !important;
    display: flex !important; flex-direction: column; padding: 56px 90px !important;
    visibility: visible !important; opacity: 1 !important; background: #fff; overflow: hidden;
    box-shadow: none !important; border-radius: 0 !important; margin: 0 !important; }
  .thumb-page.cover { padding: 108px 130px !important; }
  .thumb-page .reveal { opacity: 1 !important; transform: none !important; }
  .thumb-label { font-size: 12px; color: var(--text-sub, #64748b); padding: 6px 4px; }

  .pres-cursor { position: fixed; pointer-events: none; z-index: 9999; width: 0; height: 0; opacity: 0; transition: opacity .4s ease; }
  .pres-cursor.active { opacity: 1; }
  .pres-cursor.fading .pres-spotlight { opacity: .04; }
  .pres-cursor.fading .pres-dot { opacity: .4; }
  .pres-spotlight { position: absolute; width: 220px; height: 220px; top: 50%; left: 50%;
    transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,.16) 0%, rgba(59,130,246,.09) 35%, rgba(59,130,246,.03) 60%, transparent 80%);
    opacity: .14; transition: opacity .6s ease; }
  .pres-dot { position: absolute; width: 8px; height: 8px; top: 50%; left: 50%;
    transform: translate(-50%,-50%); border-radius: 50%; background: var(--c-info, #3b82f6);
    box-shadow: 0 0 8px rgba(59,130,246,.5); transition: opacity .6s ease; }
  .pres-cursor-hint, .player-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--text-sub, #64748b); padding: 7px 16px; border-radius: 999px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-rim), var(--glass-shadow);
    z-index: 9999; opacity: 0; transition: opacity .3s ease; pointer-events: none; white-space: nowrap; }
  .pres-cursor-hint.show, .player-hint.show { opacity: 1; }
  body.presenting { cursor: pointer; }
  body.presenting .deck-bar, body.presenting .deck-menu,
  body.presenting .deck-progress, body.presenting .deck-sidebar { opacity: 0; pointer-events: none; }

</style>
</head>
<body class="browse">
  <div class="deck-stage" id="deckStage">
    <div class="deck-fit" id="deckFit">
      <section class="slide cover" data-label="封面">
        <div style="margin:auto 0;">
          <div class="eyebrow reveal">DECK-STUDIO · STAGE FIXTURE</div>
          <h1 class="reveal">舞台架构契约 Fixture</h1>
          <p class="reveal" style="font-size:24px;color:var(--text-sub);margin-top:20px;border-left:4px solid var(--c-exec);padding-left:18px;">
            干净版：1920×1080 固定画布 · 双模式 · 三页内容完整呈现
          </p>
        </div>
      </section>
      <section class="slide" data-label="三层能力">
        <div class="eyebrow reveal">01 · 能力 / CAPABILITY</div>
        <h3 class="reveal">三层能力总览</h3>
        <div class="cards">
          <div class="card reveal"><h4 style="color:var(--c-info)">信息层</h4><p>上下文管理与状态记忆——看到什么、记住什么</p></div>
          <div class="card reveal"><h4 style="color:var(--c-exec)">执行层</h4><p>工具系统与编排系统——能做什么、怎么协作</p></div>
          <div class="card reveal"><h4 style="color:var(--c-guard)">保障层</h4><p>反馈系统与沙箱——<span class="key">做错了怎么办</span></p></div>
        </div>
      </section>
      <section class="slide" data-label="结尾">
        <div style="margin:auto 0;text-align:center;width:100%;">
          <h3 class="reveal">验证通过即交付</h3>
          <p class="reveal" style="font-size:21px;color:var(--text-sub);margin-top:20px;">
            溢出门禁退出码 0 + e2e 交互全绿 = 本 fixture 合格
          </p>
        </div>
      </section>
    </div>
  </div>

  <div class="deck-progress"><div id="progressBar"></div></div>
  <header class="deck-bar">
    <button class="deck-menu" id="deckMenu" title="页面目录">☰</button>
    <span class="deck-page" id="deckPage">1 / 3</span>
    <button class="deck-present-btn" id="presentBtn" title="放映模式 (F)">▶ 放映</button></header>
  <aside class="deck-sidebar" id="deckSidebar" aria-label="页面目录">
    <div class="deck-sidebar-head"><span>页面目录</span><button class="deck-sidebar-close" id="tocClose" title="关闭 (Esc)">×</button></div>
    <div class="deck-thumbs" id="deckThumbs"></div>
  </aside>
  <div class="player-hint" id="playerHint">滚动浏览 · ←→ 定位 · F 放映</div>

<script>
const DECK_GAP = 24;
/* ═══ DECK ENGINE:BEGIN — 唯一源 deck-studio/assets/effects/ 四件套，勿手改；同步: node deck-studio/scripts/sync-engine.mjs ═══ */

/* =====================================================================
   deck-studio 效果基建 · player.js — DeckPlayer 核心类（唯一源）
   ---------------------------------------------------------------------
   本文件是所有 deck 引擎的唯一源；deck 内的引擎块由 scripts/sync-engine.mjs
   从 assets/effects/ 四件套（player.js + stepfx.js + auto.js + ambient.js）
   生成，标记为 ═══ DECK ENGINE:BEGIN/END ═══。改引擎一律改这里再同步，
   严禁在 deck 内手改引擎块（历史事故：8 份手拷贝双向漂移）。

   player 壳 DOM 契约（完整标记见模板 assets/templates/yunshan.html）：
     必需  #deckStage > #deckFit > section.slide×N（每页 data-label 必填）
     必需  #deckBar：#progressBar #deckPage #presentBtn #deckMenu
     可选  #deckSidebar > #deckThumbs + #tocClose（缩略图目录）
     可选  #presCursor / #presCursorHint（聚光灯光标，无则 P 键不启用）
     可选  #playerHint / #presCursorHint（提示条，flashHint 已判空）
   配置（deck 数据区声明，引擎只读）：
     const DECK_GAP = 24            页间隙，缺省 24
   混合层（stepfx.js/auto.js/ambient.js）依赖：window.__deck、syncChrome
   内派发 deckpage 事件、data-label 页标识。本文件声明版本号供门禁断言。
   ===================================================================== */
window.DECK_ENGINE_VERSION = '1.0.0';

class DeckPlayer {
    constructor() {
        this.stageEl = document.getElementById('deckStage');
        this.fitEl = document.getElementById('deckFit');
        this.slides = [...this.fitEl.querySelectorAll('section.slide')];
        this.current = 0; this.mode = 'browse'; this.presenting = false; this.cursorOn = false;
        this.endArm = false; this.scale = 1;
        this.wheelAcc = 0; this.wheelQuiet = null; this.scrollRaf = null;
        this.hideTimer = null; this.rafId = null;
        this.mx = -200; this.my = -200; this.cx = -200; this.cy = -200;
        this.buildThumbs(); this.applyMode(); this.applyCurrent(0); this.syncChrome();
        addEventListener('resize', () => this.fit());
        this.bindKeys(); this.bindWheel(); this.bindScroll(); this.bindClick(); this.bindPresent();
        if (document.getElementById('presCursor')) this.bindCursor();   // 聚光灯是可选件
        document.getElementById('deckMenu')?.addEventListener('click', () => this.toggleToc());
        document.getElementById('tocClose')?.addEventListener('click', () => this.closeToc());
        this.flashHint('playerHint', this.bootHint(), 4000);
    }
    bootHint() {
        const parts = ['滚动浏览 · ←→ 定位', 'F 放映'];
        if (document.getElementById('presCursor')) parts.push('P 聚光灯');
        return parts.join(' · ');
    }
    gap() { return (typeof DECK_GAP !== 'undefined' && Number.isFinite(DECK_GAP)) ? DECK_GAP : 24; }
    pitch() { return 1080 * this.scale + this.gap(); }
    fit() {
        this.scale = Math.min(innerWidth / 1920, innerHeight / 1080);
        this.fitEl.style.transform = `scale(${this.scale})`;
        if (this.mode === 'browse') {
            this.fitEl.style.transformOrigin = 'top left';
            this.fitEl.style.marginLeft = Math.max(0, (innerWidth - 1920 * this.scale) / 2) + 'px';
            const flowH = this.slides.length * 1080 + (this.slides.length - 1) * this.gap();
            this.fitEl.style.marginBottom = (flowH * this.scale - flowH) + 'px';
            this.stageEl.scrollTop = this.current * this.pitch();
        } else {
            this.fitEl.style.transformOrigin = 'center center';
            this.fitEl.style.marginLeft = '';
            this.fitEl.style.marginBottom = '';
        }
    }
    applyMode() {
        document.body.classList.toggle('browse', this.mode === 'browse');
        document.body.classList.toggle('presenting', this.mode === 'present');
        this.fit();
        if (this.mode === 'browse') this.stageEl.scrollTop = this.current * this.pitch();
    }
    applyCurrent(i) { this.slides.forEach((s, k) => s.classList.toggle('current', k === i)); }
    syncChrome() {
        document.dispatchEvent(new CustomEvent('deckpage'));
        const pb = document.getElementById('progressBar');
        if (pb) pb.style.width = ((this.current + 1) / this.slides.length * 100) + '%';
        const pg = document.getElementById('deckPage');
        if (pg) pg.textContent = `${this.current + 1} / ${this.slides.length}`;
        this.thumbs?.forEach((t, k) => t.classList.toggle('active', k === this.current));
    }
    buildThumbs() {
        const wrap = document.getElementById('deckThumbs');
        if (!wrap) { this.thumbs = []; return; }
        this.thumbs = this.slides.map((s, i) => {
            const item = document.createElement('div');
            item.className = 'thumb-item';
            const clone = s.cloneNode(true);
            clone.classList.remove('slide');
            clone.classList.add('thumb-page');
            clone.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
            const box = document.createElement('div');
            box.className = 'thumb-box';
            const inner = document.createElement('div');
            inner.className = 'thumb-inner';
            inner.appendChild(clone);
            box.appendChild(inner);
            const label = document.createElement('div');
            label.className = 'thumb-label';
            label.textContent = `${i + 1}. ${s.dataset.label || ''}`;
            item.append(box, label);
            item.addEventListener('click', () => this.show(i));   // 跳页但保持侧栏打开，便于连续预览
            wrap.appendChild(item);
            return item;
        });
    }
    toggleToc() {
        const sb = document.getElementById('deckSidebar');
        if (!sb || !this.thumbs?.length) return;
        sb.classList.toggle('open');
        if (sb.classList.contains('open')) this.thumbs[this.current]?.scrollIntoView({ block: 'nearest' });
        this.thumbs.forEach((t, k) => t.classList.toggle('active', k === this.current));
    }
    closeToc() { document.getElementById('deckSidebar')?.classList.remove('open'); }
    show(i) {
        i = Math.max(0, Math.min(this.slides.length - 1, i));
        if (this.mode === 'present') {
            if (i === this.current && this.slides[i].classList.contains('current')) return;
            this.current = i;
            this.applyCurrent(i);
            if (this.initProgram) this.initProgram();
            if (this.presenting) this.slides[i].querySelectorAll('.shown').forEach(e => e.classList.remove('shown'));
        } else {
            this.current = i;
            this.stageEl.scrollTo({ top: i * this.pitch(), behavior: 'smooth' });
        }
        this.syncChrome();
    }
    step() {
        if (this.presenting) {
            if (this.programStep && this.programStep()) return;  // 申报程序优先（animation.md）
            const hidden = this.slides[this.current].querySelectorAll('.reveal:not(.shown)');
            if (hidden.length) { hidden[0].classList.add('shown'); this.endArm = false; return; }
            if (this.current < this.slides.length - 1) { this.show(this.current + 1); this.endArm = false; return; }
            if (!this.endArm) { this.endArm = true; this.flashHint('playerHint', '已是最后一页 · 再按一次结束放映', 2600); return; }
            this.endArm = false;
            this.endPresent();
            this.flashHint('playerHint', '放映结束', 2200);
            return;
        }
        if (this.current < this.slides.length - 1) { this.show(this.current + 1); this.endArm = false; }
        else this.flashHint('playerHint', '已是最后一页', 1800);
    }
    back() {
        this.endArm = false;
        if (this.presenting) {
            const shown = this.slides[this.current].querySelectorAll('.shown');
            if (shown.length) { shown[shown.length - 1].classList.remove('shown'); return; }
            if (this.current > 0) { this.show(this.current - 1); return; }
            this.flashHint('playerHint', '已是第一页', 1800);
            return;
        }
        if (this.current > 0) this.show(this.current - 1);
        else this.flashHint('playerHint', '已是第一页', 1800);
    }
    bindKeys() {
        document.addEventListener('keydown', e => {
            if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
            if (e.key === 'Escape') { this.closeToc(); return; }
            if (e.key === 'f' || e.key === 'F') { this.togglePresent(); return; }
            if ((e.key === 'p' || e.key === 'P') && document.getElementById('presCursor')) { this.toggleCursor(); return; }
            if (['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)) { e.preventDefault(); this.step(); }
            else if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)) { e.preventDefault(); this.back(); }
            else if (e.key === 'Home') { e.preventDefault(); this.show(0); }
            else if (e.key === 'End') { e.preventDefault(); this.show(this.slides.length - 1); }
        });
    }
    bindWheel() {
        addEventListener('wheel', e => {
            if (!this.presenting || e.ctrlKey || e.metaKey) return;
            e.preventDefault();
            clearTimeout(this.wheelQuiet);
            this.wheelAcc += e.deltaY;
            this.wheelQuiet = setTimeout(() => {
                if (Math.abs(this.wheelAcc) >= 48) this.wheelAcc > 0 ? this.step() : this.back();
                this.wheelAcc = 0;
            }, 180);
        }, { passive: false });
    }
    bindScroll() {
        this.stageEl.addEventListener('scroll', () => {
            if (this.mode !== 'browse' || this.scrollRaf) return;
            this.scrollRaf = requestAnimationFrame(() => {
                this.scrollRaf = null;
                const i = Math.max(0, Math.min(this.slides.length - 1, Math.round(this.stageEl.scrollTop / this.pitch())));
                if (i !== this.current) { this.current = i; this.applyCurrent(i); this.syncChrome(); }
            });
        }, { passive: true });
    }
    bindClick() {
        document.addEventListener('click', e => {
            const sb = document.getElementById('deckSidebar');
            if (sb?.classList.contains('open') && !e.target.closest('.deck-sidebar, .deck-menu')) { this.closeToc(); return; } // 点侧栏外即关闭
            if (!this.presenting) return;
            if (e.target.closest('a,button,input,textarea,select,.deck-bar,.deck-menu,.nav-dots,.deck-sidebar')) return;
            this.step();
        });
    }
    togglePresent() {
        if (this.presenting) { this.endPresent(); return; }
        this.mode = 'present'; this.presenting = true; this.endArm = false;
        this.applyMode();
        this.show(0);                                        // 从头播放：恒自封面起
        if (this.initProgram) this.initProgram();
        this.slides[0].querySelectorAll('.shown').forEach(el => el.classList.remove('shown'));
        document.documentElement.requestFullscreen?.().catch(() => {})
        this.flashHint('playerHint', '放映中 · →/单击 逐条推进 · F 退出', 3000);
    }
    endPresent() {
        this.mode = 'browse'; this.presenting = false; this.endArm = false;
        document.body.classList.remove('presenting');
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        this.applyMode();
        if (this.initProgram) this.initProgram();
    }
    bindPresent() {
        document.getElementById('presentBtn')?.addEventListener('click', () => this.togglePresent());
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && this.presenting) this.endPresent();   // Esc 退全屏 = 同步退放映
        });
    }
    bindCursor() {
        this.cursor = document.getElementById('presCursor');
        document.addEventListener('mousemove', e => {
            this.mx = e.clientX; this.my = e.clientY;
            if (!this.cursorOn) return;
            this.cursor.classList.add('active');
            this.cursor.classList.remove('fading');
            clearTimeout(this.hideTimer);
            this.hideTimer = setTimeout(() => this.cursor.classList.add('fading'), 2000);
        });
    }
    toggleCursor() {
        this.cursorOn = !this.cursorOn;
        if (this.cursorOn) {
            document.body.style.cursor = 'none';
            this.cursor.classList.add('active');
            this.cursor.classList.remove('fading');
            this.rafId = requestAnimationFrame(() => this.cursorLoop());
            this.flashHint('presCursorHint', '演示光标已开启 · 按 P 关闭', 2000);
        } else {
            document.body.style.cursor = '';
            this.cursor.classList.remove('active', 'fading');
            cancelAnimationFrame(this.rafId);
            this.flashHint('presCursorHint', '演示光标已关闭', 1500);
        }
    }
    cursorLoop() {
        this.cx += (this.mx - this.cx) * .25;
        this.cy += (this.my - this.cy) * .25;
        this.cursor.style.left = this.cx + 'px';
        this.cursor.style.top = this.cy + 'px';
        if (this.cursorOn) this.rafId = requestAnimationFrame(() => this.cursorLoop());
    }
    flashHint(id, text, dur) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = text; el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), dur || 2000);
    }
}

/* =====================================================================
   deck-studio 效果基建 · stepfx.js
   步进程序（DECK_STEPS）执行器：分块 / 走查联动 / 脉冲 / 巡游（含闸门停顿）。
   用法：
     1. 前置：player 壳（DeckPlayer 类 + window.__deck + syncChrome 内派发 deckpage 事件）
     2. 本文件整体粘贴到 deck 脚本内、`new DeckPlayer()` 之后（mixin 挂到原型）
     3. 作者只声明 window.DECK_STEPS 数据（格式见 references/animation.md），不改引擎
   提取自参考实现 docs/emp/agent-concept_deck-studio.html（已验证）。
   工程警告：fx 元素缓存属性勿与方法同名（fxToken 属性/方法冲突曾致巡游卡死，令名 newToken）。
   ===================================================================== */
Object.assign(DeckPlayer.prototype, {
    /* 放映态 step() 顶部必须先调用本钩子（返回 true = 本次点击已被程序消费）：
       if (this.programStep && this.programStep()) return;                              */
    programStep() {
        if (this.tourWait) { const r = this.tourResolve; this.tourWait = false; this.busy = true; if (r) r(); return true; }
        if (this.tourActive) { this.tourSkip = true; return true; }
        if (this.busy) { this.seqSkip = true; return true; }      // 动画进行中：点击=快进当前序列
        const label = this.slides[this.current].dataset.label;
        if (this.progLabel !== label) {
            this.progLabel = label;
            this.prog = (window.DECK_STEPS || {})[label] || null;
            this.pi = 0;
            if (this.prog) {                                       // 结论条遮盖：自动置位，不消耗点击
                while (this.prog[this.pi] && this.prog[this.pi][0] === 'sumhide') {
                    this.runAction(this.prog[this.pi]); this.pi++;
                }
            }
        }
        if (!this.prog) return false;
        if (this.pi >= this.prog.length) return false;
        const a = this.prog[this.pi++];
    this.busy = true;
    Promise.resolve(this.runAction(a)).finally(() => { this.busy = false; });   // finally：动作抛错也不得卡死按键
    return true;
    },
    /* 换页 / 退出放映时调用：清 fx、重置程序指针（终态不变式）。
       放映态进页即前置 sumhide（结论条从进页就遮住，而非首击才遮——防结论剧透）；
       浏览态（endPresent 后 presenting=false）不置位，保持静态整页。 */
    initProgram() {
        this.prog = null; this.progLabel = null; this.pi = 0;
        this.tourActive = false; this.tourWait = false; this.tourSkip = false;
        this.busy = false;                                   // 换页硬复位：在途动作的 finally 兜底，不会双清
        this.clearFx();
        if (!this.presenting) return;
        const label = this.slides[this.current].dataset.label;
        const prog = (window.DECK_STEPS || {})[label];
        if (!prog) return;
        this.progLabel = label; this.prog = prog; this.pi = 0;
        while (this.prog[this.pi] && this.prog[this.pi][0] === 'sumhide') {
            this.runAction(this.prog[this.pi]); this.pi++;
        }
    },
    clearFx() {
        if (this.fxRaf) { cancelAnimationFrame(this.fxRaf); this.fxRaf = null; }
        if (this.fx) this.fx.remove();
        this.fx = null; this.fxSvg = null; this.fxToken = null; this.fxVeilEl = null;
        this.walkEl = null; this.walkEl2 = null; this.gateEl = null; this.sumCoverEl = null; this.seqSkip = false;
    },
    fxLayer() {
        const svg = this.slides[this.current].querySelector('svg');
        if (!svg) return null;
        if (!this.fx || this.fxSvg !== svg) {
            this.fx = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            this.fx.setAttribute('class', 'fx-layer');
            svg.appendChild(this.fx);
            this.fxSvg = svg;
        }
        return this.fx;
    },
    fxEl(tag, attrs, cls) {
        const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        if (cls) el.setAttribute('class', cls);
        if (this.fx) this.fx.appendChild(el);   // 无层（页面已切走）时返回游离节点，不致崩溃
        return el;
    },
    wait(ms) { return new Promise(r => setTimeout(r, ms)); },
    async runAction(a) {
        const fx = this.fxLayer();
        if (!fx) return;
        const kind = a[0];
        if (kind === 't') return this.runTour(a[1]);
        if (kind === 'w') {                                   // 走查（多区域 = 联动），上次自动退回
            if (this.walkEl) this.walkEl.remove();
            if (this.walkEl2) this.walkEl2.remove();
            const r = a[1];
            this.walkEl = this.fxEl('rect', { x: r[0], y: r[1], width: r[2], height: r[3], rx: 8, class: 'fx-lit' });
            if (a[2]) this.walkEl2 = this.fxEl('rect', { x: a[2][0], y: a[2][1], width: a[2][2], height: a[2][3], rx: 8, class: 'fx-lit' });
            await this.wait(140);
            return;
        }
        if (kind === 'c') {                                   // 分块：将 .reveal 元素标记为已放出
            for (let i = 1; i < a.length; i++)
                document.querySelectorAll(a[i]).forEach(el => el.classList.add('shown'));
            await this.wait(140);
            return;
        }
        if (kind === 'pulse') {                               // 一次性点名脉冲
            const r = a[1];
            const el = this.fxEl('rect', { x: r[0], y: r[1], width: r[2], height: r[3], rx: 10, class: 'fx-pulse' });
            await this.wait(950);
            el.remove();
            return;
        }
        if (kind === 'sumhide') {                             // 结论条遮盖（自动置位）
            const r = a[1];
            this.sumCoverEl = this.fxEl('rect', { x: r[0], y: r[1], width: r[2], height: r[3], class: 'fx-sumcover on' });
            return;
        }
        if (kind === 'sumshow') {                             // 结论揭示（末拍）
            const el = this.sumCoverEl;                       // 局部引用：等待期间 clearFx 可能置空（换页），不得对 null remove
            if (el) {
                el.classList.remove('on');
                await this.wait(520);
                el.remove();
                if (this.sumCoverEl === el) this.sumCoverEl = null;
            }
            return;
        }
        if (kind === 'wseq') {                                // 自动连播走查：逐个点亮，点击=全部立即点亮
            const els = a[1].map(r => this.fxEl('rect', { x: r[0], y: r[1], width: r[2], height: r[3], rx: 8, class: 'fx-lit', opacity: 0 }));
            const iv = a[2] || 900;
            for (let i = 0; i < els.length; i++) {
                els[i].style.opacity = 1;
                await this.wait(iv);
                if (this.seqSkip) { els.forEach(e => { e.style.opacity = 1; }); break; }
            }
            return;
        }
    },
    async runTour(micros) {
        this.tourActive = true; this.tourSkip = false;
        for (const m of micros) {
            if (this.tourSkip && m[0] !== 'gate') { this.skipMicro(m); continue; }
            switch (m[0]) {
                case 'veil': this.fxVeil(m[1]); await this.wait(420); break;
                case 'lit': this.fxGlow(m[1], 'fx-lit'); await this.wait(160); break;
                case 'state': this.fxGlow(m[1], 'fx-state'); await this.wait(160); break;
                case 'move': await this.fly(m[1], m[2], m[3], m[4], m[5] || 550, '#2563eb'); break;
                case 'move2': await this.fly2(m[1], m[2], m[3], m[4], m[5], m[6], m[7] || 700); break;
                case 'back': await this.fly(m[1], m[2], m[3], m[4], m[5] || 480, '#ef4444'); break;
                case 'pulse': { const el = this.fxEl('rect', { x: m[1][0], y: m[1][1], width: m[1][2], height: m[1][3], rx: 10, class: 'fx-pulse' }); await this.wait(900); el.remove(); break; }
                case 'gate': if (this.tourSkip) break; await this.waitGate(m[1], m[2]); break;
            }
        }
        this.tourActive = false; this.tourSkip = false;
        await this.endTour();
    },
    skipMicro(m) {
        if (m[0] === 'veil') { this.fxVeil(m[1]); this.fxVeilEl.classList.add('on'); }
        else if (m[0] === 'lit') this.fxGlow(m[1], 'fx-lit');
        else if (m[0] === 'state') this.fxGlow(m[1], 'fx-state');
    },
    fxVeil(rect) {
        if (!this.fxVeilEl) this.fxVeilEl = this.fxEl('rect', { x: rect[0], y: rect[1], width: rect[2], height: rect[3], rx: 10, class: 'fx-veil' });
        requestAnimationFrame(() => this.fxVeilEl.classList.add('on'));
    },
    fxGlow(rect, cls) {
        this.fxEl('rect', { x: rect[0], y: rect[1], width: rect[2], height: rect[3], rx: 8, class: cls });
    },
    newToken(color) {
        if (!this.fxToken) this.fxToken = this.fxEl('circle', { r: 9, fill: color, opacity: .95, stroke: '#fff', 'stroke-width': 2 });
        this.fxToken.setAttribute('fill', color);
        this.fxToken.setAttribute('opacity', .95);
        return this.fxToken;
    },
    fly(x1, y1, x2, y2, dur, color) {
        return new Promise(res => {
            const token = this.newToken(color);
            const t0 = performance.now();
            const tick = now => {
                if (!this.tourActive) { res(); return; }
                const k = this.tourSkip ? 1 : Math.min(1, (now - t0) / dur);
                const e = 1 - Math.pow(1 - k, 3);
                token.setAttribute('cx', x1 + (x2 - x1) * e);
                token.setAttribute('cy', y1 + (y2 - y1) * e);
                if (k < 1) this.fxRaf = requestAnimationFrame(tick); else res();
            };
            this.fxRaf = requestAnimationFrame(tick);
        });
    },
    fly2(ax, ay, bx, by, tx, ty, dur) {                      // 双光点汇合（并行语义）
        return new Promise(res => {
            const ta = this.fxEl('circle', { r: 8, fill: '#f59e0b', opacity: .95, stroke: '#fff', 'stroke-width': 2 });
            const tb = this.fxEl('circle', { r: 8, fill: '#f59e0b', opacity: .95, stroke: '#fff', 'stroke-width': 2 });
            const t0 = performance.now();
            const tick = now => {
                if (!this.tourActive) { ta.remove(); tb.remove(); res(); return; }
                const k = this.tourSkip ? 1 : Math.min(1, (now - t0) / dur);
                const e = 1 - Math.pow(1 - k, 3);
                ta.setAttribute('cx', ax + (tx - ax) * e); ta.setAttribute('cy', ay + (ty - ay) * e);
                tb.setAttribute('cx', bx + (tx - bx) * e); tb.setAttribute('cy', by + (ty - by) * e);
                if (k < 1) this.fxRaf = requestAnimationFrame(tick); else { ta.remove(); tb.remove(); res(); }
            };
            this.fxRaf = requestAnimationFrame(tick);
        });
    },
    waitGate(x, y) {                                         // 闸口：语义性暂停（点击=确认），先推进路由索引
        this.gateEl = this.fxEl('circle', { cx: x, cy: y, r: 16 }, 'fx-gate');
        this.flashHint('playerHint', '单击确认，继续', 1600);
        this.tourWait = true;
        this.busy = false;
        return new Promise(res => { this.tourResolve = () => { if (this.gateEl) { this.gateEl.remove(); this.gateEl = null; } res(); }; });
    },
    async endTour() {
        if (this.fxVeilEl) { this.fxVeilEl.classList.remove('on'); await this.wait(450); }
        if (this.fxToken) this.fxToken.setAttribute('opacity', 0);
        await this.wait(200);
        this.clearFx();
    },
});

/* =====================================================================
   deck-studio 效果基建 · auto.js — A 型自动连播调度器（唯一源）
   ---------------------------------------------------------------------
   A 型触发（animation.md）：过程自解释的内容（流水线/主干/融合巡游），
   页面激活即演一遍（浏览/放映皆演），无需点击；点击=快进当前序列；
   prefers-reduced-motion 静态；每页每次进入只演一遍，离页再来重演。
   作者只声明数据（deck 数据区，勿改本文件）：
     window.DECK_AUTO = { 页label: [ 微指令... ] };
     微指令：['flow', x1,y1, x2,y2, dur?, color?]  流线脉冲：一段"撑大的线"沿起点→终点流转后消失（dur 缺省 600ms，color 缺省 #60a5fa）
             ['flows', [[x1,y1,x2,y2, color?],...], dur?, color?]  多条流线同时流转（扇出/并行；每线颜色可单独覆盖）
             ['pulse', [x,y,w,h]]              到站脉冲：区域中心蓝色涟漪，~750ms 即逝，不染色
             ['pulses', [[x,y,w,h],...]]       多区域同时脉冲（同步到站语义）
             ['lit', [x,y,w,h]]                （遗留·染色）区域点亮——不染色法则下禁用
             ['wseq', [rect,...]]              （遗留·染色）多区域连播——同上
   序列收尾：fx 层清空，页面 100% 恢复原样（终态不变式）；
   序列绑定进页时的页号，换页即作废（防止旧序列画到新页上——串页事故 2026-09-24）。
   依赖：player.js（window.__deck + deckpage 事件）与 stepfx.js（fxLayer/
   fxEl/newToken/wait——本文件在混合层之后装配）。无数据时本模块不装配。
   ===================================================================== */
(function () {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const boot = () => {
        const deck = window.__deck;
        if (!deck) return;
        let playedFor = null, skip = false, raf = 0, pageIdx = -1;
        const seq = () => (window.DECK_AUTO || {})[deck.slides[deck.current].dataset.label];
        function lit(rect) {
            const fx = deck.fxLayer();
            if (!fx || !deck.slides[deck.current].querySelector('svg')) return Promise.resolve();
            const e = deck.fxEl('rect', { x: rect[0], y: rect[1], width: rect[2], height: rect[3], rx: 8, class: 'fx-lit auto' });
            e.setAttribute('opacity', 0);
            requestAnimationFrame(() => { e.style.transition = 'opacity .4s ease'; e.style.opacity = 1; });
            return deck.wait(420);
        }
        function pulse(rect) {
            const fx = deck.fxLayer();
            if (!fx || !deck.slides[deck.current].querySelector('svg')) return;
            const c = deck.fxEl('circle', { cx: rect[0] + rect[2] / 2, cy: rect[1] + rect[3] / 2, r: 14 }, 'fpulse');
            setTimeout(() => c.remove(), 750);
        }
        /* 流线脉冲：覆盖线与箭头同几何，短划（撑大段）经 stroke-dashoffset 从起点流转到终点后移除 */
        function flow(x1, y1, x2, y2, dur, color) {
            return new Promise(res => {
                const fx = deck.fxLayer();
                if (!fx || !deck.slides[deck.current].querySelector('svg')) return res();
                const len = Math.max(1, Math.hypot(x2 - x1, y2 - y1));
                const seg = Math.min(64, len * 0.45);
                const line = deck.fxEl('line', { x1, y1, x2, y2, stroke: color || '#60a5fa',
                    'stroke-width': 5, 'stroke-linecap': 'round', opacity: .9 });
                line.setAttribute('stroke-dasharray', `${seg} ${len + seg}`);
                line.setAttribute('stroke-dashoffset', seg);            // 起点前藏住
                fx.appendChild(line);
                const t0 = performance.now();
                const tick = now => {
                    if (skip || deck.current !== pageIdx) { line.remove(); return res(); }
                    const k = Math.min(1, (now - t0) / dur);
                    const e = 1 - Math.pow(1 - k, 3);
                    line.setAttribute('stroke-dashoffset', seg - (seg + len) * e);
                    if (k < 1) raf = requestAnimationFrame(tick); else { line.remove(); res(); }
                };
                raf = requestAnimationFrame(tick);
            });
        }
        function move(x1, y1, x2, y2, dur, color) {              // （遗留·光点）不染色法则下新 deck 勿用
            return new Promise(res => {
                if (!deck.slides[deck.current].querySelector('svg')) return res();
                const token = deck.newToken(color || '#2563eb');
                const t0 = performance.now();
                const tick = now => {
                    if (skip) { token.setAttribute('cx', x2); token.setAttribute('cy', y2); return res(); }
                    const k = Math.min(1, (now - t0) / dur);
                    const e = 1 - Math.pow(1 - k, 3);
                    token.setAttribute('cx', x1 + (x2 - x1) * e);
                    token.setAttribute('cy', y1 + (y2 - y1) * e);
                    if (k < 1) raf = requestAnimationFrame(tick); else res();
                };
                raf = requestAnimationFrame(tick);
            });
        }
        async function run() {
            const micros = seq(); if (!micros) return;
            pageIdx = deck.current;                              // 序列绑定进页时的页面：换页即作废（防串页）
            deck.autoBusy = true; skip = false;
            const stale = () => deck.current !== pageIdx;
            for (const m of micros) {
                if (stale()) { deck.autoBusy = false; return; }
                if (skip) { if (m[0] === 'lit') { const fx = deck.fxLayer(); const e = deck.fxEl('rect', { x: m[1][0], y: m[1][1], width: m[1][2], height: m[1][3], rx: 8, class: 'fx-lit' }); e.setAttribute('opacity', 1); } else if (m[0] === 'wseq') { for (const r of m[1]) { const fx = deck.fxLayer(); if (!fx) break; const e = deck.fxEl('rect', { x: r[0], y: r[1], width: r[2], height: r[3], rx: 8, class: 'fx-lit' }); e.setAttribute('opacity', 1); } } continue; }
                if (m[0] === 'lit') await lit(m[1]);
                else if (m[0] === 'wseq') { for (const r of m[1]) await lit(r); }
                else if (m[0] === 'flow') await flow(m[1], m[2], m[3], m[4], m[5] || 600, m[6]);
                else if (m[0] === 'flows') await Promise.all(m[1].map(w => flow(w[0], w[1], w[2], w[3], m[2] || 900, w[4] || m[3])));
                else if (m[0] === 'move') await move(m[1], m[2], m[3], m[4], m[5] || 500, m[6]);
                else if (m[0] === 'pulse') { pulse(m[1]); await deck.wait(skip ? 60 : 420); }
                else if (m[0] === 'pulses') { for (const r of m[1]) pulse(r); await deck.wait(skip ? 60 : 750); }
            }
            if (stale()) { deck.autoBusy = false; return; }      // 已换页：fx 归新页面序列所有
            deck.autoBusy = false;
            setTimeout(() => { if (!deck.autoBusy && deck.current === pageIdx) deck.clearFx(); }, 700);
        }
        function onpage() {
            const label = deck.slides[deck.current].dataset.label;
            if (seq() && playedFor !== deck.current) { playedFor = deck.current; run(); }
            else if (!seq()) playedFor = null;
        }
        document.addEventListener('click', () => { if (deck.autoBusy) skip = true; }, true);   // 点击=快进（捕获阶段，先于推进）
        document.addEventListener('deckpage', () => { onpage(); });
        onpage();
    };
    if (window.__deck) boot(); else addEventListener('load', boot, { once: true });
})();

/* =====================================================================
   deck-studio 效果基建 · countup.js — 数字滚动（A 型入口动效，唯一源）
   ---------------------------------------------------------------------
   进页把声明的数字文本从 0 滚到真值（8 机制之 count-up），轻错拍依次启动；
   终帧严格还原原文（含前后缀，如「50+」「≈3~5×」）——终态不变式。
   reduced-motion 静态；同页重复进入会重滚（与 auto 语义一致）。
   作者只声明数据（deck 数据区，勿改本文件）：
     window.DECK_COUNTUP = {
       页label: { ms: 1200, items: [[x, y], ...] },   // (x,y) = svg <text> 的坐标属性
     };
   匹配规则：页 svg 内 x/y 属性精确相等的 <text>；文本解析为「前缀 + 整数 + 后缀」
   滚动整数部分。找不强求——没匹配到就静默跳过。
   依赖：player.js（window.__deck + deckpage 事件）。无声明时本模块不装配。
   ===================================================================== */
(function () {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const boot = () => {
        const deck = window.__deck, CFG = window.DECK_COUNTUP;
        if (!deck || !CFG) return;
        let playedFor = null;
        function roll(pageLabel) {
            const conf = CFG[pageLabel]; if (!conf) return;
            const svg = deck.slides[deck.current].querySelector('svg'); if (!svg) return;
            const texts = [...svg.querySelectorAll('text')];
            const els = (conf.items || [])
                .map(([x, y]) => texts.find(t => +t.getAttribute('x') === x && +t.getAttribute('y') === y))
                .filter(Boolean);
            if (!els.length) return;
            const dur = conf.ms || 1200;
            els.forEach((el, k) => {
                const orig = el.textContent;
                const m = orig.match(/^(\D*?)(\d[\d,]*)(.*)$/); if (!m) return;
                const target = parseInt(m[2].replace(/,/g, ''), 10);
                const t0 = performance.now() + k * 120;          // 轻微错拍，不齐刷刷
                const tick = now => {
                    const p = Math.min(1, Math.max(0, (now - t0) / dur));
                    if (p >= 1) { el.textContent = orig; return; }   // 终帧 = 原文
                    const e = 1 - Math.pow(1 - p, 3);
                    el.textContent = m[1] + Math.round(target * e) + m[3];
                    requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            });
        }
        function onpage() {
            const label = deck.slides[deck.current].dataset.label;
            if (CFG[label] && playedFor !== deck.current) { playedFor = deck.current; roll(label); }
            else if (!CFG[label]) playedFor = null;
        }
        document.addEventListener('deckpage', onpage);
        onpage();
    };
    if (window.__deck) boot(); else addEventListener('load', boot, { once: true });
})();

/* =====================================================================
   deck-studio 效果基建 · ambient.js — 常驻流转控制器（唯一源）
   ---------------------------------------------------------------------
   闭环/迭代机制页的"活流程"——光点循环巡航，每周期走完全部回路（打回
   分支逐一出演）后到达产出节点，休息后开新周期。离页自动暂停；
   prefers-reduced-motion 静态；每 deck 至多一处（animation.md 限定）。
   作者只声明数据（deck 数据区，勿改本文件）：
     window.DECK_AMBIENT = {
       pageLabel: '机制',        // 常驻流转所在页的 data-label（无此页则不装配）
       speed: 200,               // 光点速度（viewBox 单位/秒）：平滑追踪舒适区 ~30°/s 视角，沿线需读标签
       decideMs: 500,            // 判定菱形停留：标签识读 ≥400ms
       gateMs: 950,              // 闸口停留：语义"等人"，需明显长于判定
       restMs: 1800,             // 整周期交付后的呼吸停顿
       routes: [                 // 回路路线：按演示顺序排列，全部走完回起点开新周期
         { kind: 'fail1', backFrom: 4, decide: { at: 4, ms: decideMs, then: 'red' },
           wp: [[105,74],[231,76], ...] },   // backFrom=从该序号起光点变红；decide.at=判定点序号
         { kind: '复杂路线', backFrom: 99,
           decides: { 3: { ms: 950, gate: true, then: 'red' }, 7: { ms: 500, then: 'blue' } },
           wp: [...] },                      // decides=多点判定（序号→{ms,gate,then}），色彩只由判定驱动，
       ],                                    // 表达"一条路线走满全部回路"；与单判定 decide 互斥
       nodes: { 0:[x,y,w,h], ... },          // 节点脉冲框（按光点坐标命中，无则只过光点）
       stateAt: 6, stateRect: [x,y,w,h],     // 可选：到达该序号点亮状态区，周期结束熄灭；不需要设 null
     };
   依赖：player.js（window.__deck + deckpage 事件）+ effects.css（ambient-layer 样式）。
   ===================================================================== */
(function () {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const boot = () => {
        const deck = window.__deck, CFG = window.DECK_AMBIENT;
        if (!deck || !CFG) return;                          // 本 deck 无常驻流转声明 → 不装配
        const IDX = deck.slides.findIndex(s => s.dataset.label === CFG.pageLabel);
        if (IDX < 0) return;
        const SPEED = CFG.speed || 200, DECIDE_MS = CFG.decideMs || 500,
              GATE_MS = CFG.gateMs || 950, REST_MS = CFG.restMs || 1800;
        const ROUTES = CFG.routes || [], NODES = CFG.nodes || {},
              STATE_AT = (CFG.stateAt == null ? null : CFG.stateAt),
              STATE_RECT = CFG.stateRect || null;

        /* ==================== 引擎区（作者勿改） ==================== */
        const NS = 'http://www.w3.org/2000/svg';
        let layer = null, token = null, stateEl = null, gateEl = null;
        let cycleIdx = 0, ri = 0, segT = 0;
        let phase = 'move', phaseT = 0, afterPhase = null, last = 0, raf = 0, poll = 0;

        const kind = () => ROUTES[cycleIdx].kind;
        const route = () => ROUTES[cycleIdx].wp;
        const active = () => deck.current === IDX && !document.hidden;
        function el(tag, attrs, cls) {
            const n = document.createElementNS(NS, tag);
            for (const k in attrs) n.setAttribute(k, attrs[k]);
            if (cls) n.setAttribute('class', cls);
            layer.appendChild(n);
            return n;
        }
        function build() {
            const svg = deck.slides[IDX].querySelector('svg');
            layer = document.createElementNS(NS, 'g');
            layer.setAttribute('class', 'ambient-layer');
            svg.appendChild(layer);
            token = el('circle', { cx: route()[0][0], cy: route()[0][1], r: 8 }, 'ftoken');
            token.setAttribute('fill', '#2563eb');
            token.setAttribute('stroke', '#fff');
            token.setAttribute('stroke-width', 2);
            if (STATE_AT != null && STATE_RECT) {
                stateEl = el('rect', { x: STATE_RECT[0], y: STATE_RECT[1], width: STATE_RECT[2], height: STATE_RECT[3], rx: 8 }, 'fstate');
            }
        }
        function nodePulse(i) {
            /* 按光点当前坐标命中节点框（不同路线的 waypoint 序号语义不同，不能按序号查表） */
            const pt = route()[i];
            if (!pt) return;
            for (const k in NODES) {
                const r = NODES[k];
                if (pt[0] >= r[0] && pt[0] <= r[0] + r[2] && pt[1] >= r[1] && pt[1] <= r[1] + r[3]) {
                    const c = el('circle', { cx: r[0] + r[2] / 2, cy: r[1] + r[3] / 2, r: 12 }, 'fpulse');
                    setTimeout(() => c.remove(), 750);
                    return;
                }
            }
        }
        function setPos(pt) { token.setAttribute('cx', pt[0]); token.setAttribute('cy', pt[1]); }
        function setToken(fill) { token.setAttribute('fill', fill); }
        function pause(ms, after) { phase = 'pause'; phaseT = ms; afterPhase = after || null; }
        function arrive(i) {
            nodePulse(i);
            const R = ROUTES[cycleIdx];
            if (R.decides) {                                           // 多点判定路线：色彩由各判定驱动
                const d = R.decides[i];
                if (d) {
                    setToken(d.gate ? '#f59e0b' : '#ef4444');
                    if (d.gate) { if (!gateEl) gateEl = el('circle', { cx: route()[i][0], cy: route()[i][1], r: 16 }, 'fgate'); gateEl.style.opacity = 1; }
                    ri++;
                    return pause(d.ms, () => {
                        if (gateEl) { gateEl.remove(); gateEl = null; }    // 移除元素（内联 opacity 压不过无限动画）
                        setToken(d.then === 'red' ? '#ef4444' : '#2563eb');
                        if (d.then === 'red' && stateEl) stateEl.classList.remove('on');
                    });
                }
            } else {
            setToken(i >= R.backFrom ? '#ef4444' : '#2563eb');
            const d = R.decide;
            if (d && i === d.at) {                                     // 判定停顿：先推进索引再停（杜绝折返卡死）
                setToken(d.gate ? '#f59e0b' : '#ef4444');
                if (!gateEl) gateEl = el('circle', { cx: route()[i][0], cy: route()[i][1], r: 16 }, 'fgate');
                gateEl.style.opacity = 1;
                ri++;
                return pause(d.ms, () => {
                    if (gateEl) { gateEl.remove(); gateEl = null; }    // 移除元素（内联 opacity 压不过无限动画）
                    if (d.then === 'red') { setToken('#ef4444'); if (stateEl) stateEl.classList.remove('on'); }
                    else setToken('#2563eb');
                });
            }
            }
            if (kind() === 'pass' && i === STATE_AT && stateEl) stateEl.classList.add('on');
            ri++;
            if (ri >= route().length - 1) endRoute();
        }
        function endRoute() {
            const k = kind();
            if (k === 'pass') {                                        // 全回路走完 → 交付产出，休息后开新周期
                phase = 'rest'; phaseT = REST_MS;
                token.setAttribute('opacity', 0);
                afterPhase = () => { if (stateEl) stateEl.classList.remove('on'); nextRoute(); setPos(route()[0]); setToken('#2563eb'); token.setAttribute('opacity', .95); };
            } else {                                                   // 打回路线走完：改代码处重启脉冲
                nodePulse(0);
                phase = 'pause'; phaseT = 450;
                afterPhase = () => { nextRoute(); setToken('#2563eb'); };
            }
        }
        function nextRoute() { cycleIdx = (cycleIdx + 1) % ROUTES.length; ri = 0; segT = 0; }
        function step(dt) {
            if (phase !== 'move') {
                phaseT -= dt;
                if (phaseT <= 0) { const f = afterPhase; afterPhase = null; phase = 'move'; if (f) f(); }
                return;
            }
            const wp = route();
            const A = wp[ri], B = wp[ri + 1];
            const len = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1;
            segT += dt / 1000 * SPEED;
            const k = Math.min(1, segT / len);
            setPos([A[0] + (B[0] - A[0]) * k, A[1] + (B[1] - A[1]) * k]);
            if (k >= 1) { segT = 0; arrive(ri + 1); }
        }
        function frame(now) {
            if (!active()) { raf = 0; poll = setTimeout(schedule, 400); return; }
            if (!last) last = now;
            step(Math.min(50, now - last));
            last = now;
            raf = requestAnimationFrame(frame);
        }
        function schedule() {
            cancelAnimationFrame(raf); clearTimeout(poll);
            if (active()) { if (!layer) build(); last = 0; raf = requestAnimationFrame(frame); }
            else poll = setTimeout(schedule, 400);
        }
        document.addEventListener('deckpage', schedule);
        schedule();
    };
    if (window.__deck) boot(); else addEventListener('load', boot, { once: true });
})();

/* ═══ DECK ENGINE:END ═══ */
window.__deck = new DeckPlayer();
</script>
