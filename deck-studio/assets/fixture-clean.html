<!DOCTYPE html>
<!-- deck-studio 契约验证 fixture（干净版·舞台架构）：应通过溢出门禁（退出码 0）与 e2e 真实交互测试。
     契约要素：deck-stage>deck-fit 舞台 / section.slide[data-label] 1920×1080 / .reveal 步进 /
     播放器杂物类名 .deck-bar .deck-progress .nav-dots .player-hint / 主题色 token 化 / 零滚动零 IO。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>deck-studio fixture · 干净版</title>
<style>
  :root {
    --c-info: #3b82f6; --c-exec: #2563eb; --c-guard: #60a5fa;
    --bg-card: #f8fafc; --border-card: #e2e8f0; --bg-block: #f1f5f9;
    --text: #1e293b; --text-sub: #64748b; --text-faint: #94a3b8;
    --c-pass: #1d4ed8;
    --ease-out-expo: cubic-bezier(.16,1,.3,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #e8eaf0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); }
  .deck-stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .deck-fit { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden;
    background: #fff; box-shadow: 0 12px 48px rgba(15,23,42,.18); border-radius: 8px; transform-origin: center center; }
  .slide { position: absolute; inset: 0; width: 1920px; height: 1080px; padding: 56px 90px;
    display: flex; flex-direction: column; overflow: hidden; background: #fff;
    visibility: hidden; opacity: 0; transition: opacity .35s ease, visibility 0s linear .35s; }
  .slide.current { visibility: visible; opacity: 1; transition: opacity .35s ease; }
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .5s var(--ease-out-expo), transform .5s var(--ease-out-expo); }
  .slide.current .reveal { opacity: 1; transform: none; }
  body.presenting .slide.current .reveal:not(.shown) { opacity: 0 !important; transform: translateY(18px) !important; }
  .eyebrow { font-family: ui-monospace, monospace; font-size: 18px; letter-spacing: .2em; color: var(--c-exec); margin-bottom: 10px; }
  h1 { font-size: 76px; font-weight: 800; line-height: 1.15; }
  h3 { font-size: 46px; font-weight: 600; letter-spacing: -.02em; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 32px; flex: 1; min-height: 0; }
  .card { background: #fff; border: 1px solid #d5d9de; border-radius: 14px; padding: 24px; overflow: hidden; }
  .card h4 { font-size: 24px; font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid #e1e4e7; }
  .card p { font-size: 21px; color: var(--text-sub); line-height: 1.45; margin-top: 14px; }
  .key { color: var(--c-pass); font-weight: 700; }
  .deck-progress { position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 100; background: rgba(15,23,42,.08); }
  #progressBar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--c-info), var(--c-exec)); transition: width .4s ease; }
  .nav-dots { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); z-index: 100; display: flex; flex-direction: column; gap: 7px; }
  .nav-dot { width: 7px; height: 7px; border-radius: 50%; background: #b6bdc9; cursor: pointer; transition: all .3s ease; }
  .nav-dot.active { background: var(--c-exec); transform: scale(1.5); }
  .deck-bar { position: fixed; top: 14px; right: 16px; z-index: 110; display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.72); backdrop-filter: blur(12px); border: 1px solid rgba(226,232,240,.9);
    border-radius: 999px; padding: 7px 9px 7px 16px; box-shadow: 0 4px 16px rgba(15,23,42,.08);
    font-size: 13px; color: var(--text-sub); transition: opacity .4s ease; }
  .deck-page { font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  .deck-present-btn { border: none; cursor: pointer; border-radius: 999px; padding: 6px 14px;
    background: var(--c-exec); color: #fff; font-size: 13px; font-weight: 600; }
  .player-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 12px;
    color: var(--text-faint); background: rgba(255,255,255,.9); padding: 6px 16px; border-radius: 20px;
    border: 1px solid var(--border-card); z-index: 9999; opacity: 0; transition: opacity .3s ease;
    pointer-events: none; white-space: nowrap; }
  .player-hint.show { opacity: 1; }
  body.presenting { cursor: pointer; }
  body.presenting .deck-bar, body.presenting .nav-dots, body.presenting .deck-progress { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div class="deck-stage">
    <div class="deck-fit" id="deckFit">
      <section class="slide" data-label="封面">
        <div style="margin:auto 0;">
          <div class="eyebrow reveal">DECK-STUDIO · STAGE FIXTURE</div>
          <h1 class="reveal">舞台架构契约 Fixture</h1>
          <p class="reveal" style="font-size:24px;color:var(--text-sub);margin-top:20px;border-left:4px solid var(--c-exec);padding-left:18px;">
            干净版：1920×1080 固定画布 · 三页内容完整呈现
          </p>
        </div>
      </section>
      <section class="slide" data-label="三层能力">
        <div class="eyebrow reveal">01 · 能力 / CAPABILITY</div>
        <h3 class="reveal">三层能力总览</h3>
        <div class="cards">
          <div class="card reveal"><h4 style="color:var(--c-info)">信息层</h4><p>上下文管理与状态记忆——看到什么、记住什么</p></div>
          <div class="card reveal"><h4 style="color:var(--c-exec)">执行层</h4><p>工具系统与编排系统——能做什么、怎么协作</p></div>
          <div class="card reveal"><h4 style="color:var(--c-guard)">保障层</h4><p>反馈系统与沙箱——<span class="key">做错了怎么办</span></p></div>
        </div>
      </section>
      <section class="slide" data-label="结尾">
        <div style="margin:auto 0;text-align:center;width:100%;">
          <h3 class="reveal">验证通过即交付</h3>
          <p class="reveal" style="font-size:21px;color:var(--text-sub);margin-top:20px;">
            溢出门禁退出码 0 + e2e 交互全绿 = 本 fixture 合格
          </p>
        </div>
      </section>
    </div>
  </div>

  <div class="deck-progress"><div id="progressBar"></div></div>
  <nav class="nav-dots" id="navDots" aria-label="页面导航"></nav>
  <header class="deck-bar"><span class="deck-page" id="deckPage">1 / 3</span>
    <button class="deck-present-btn" id="presentBtn" title="放映模式 (F)">▶ 放映</button></header>
  <div class="player-hint" id="playerHint">←→ 翻页 · F 放映</div>

<script>
class DeckPlayer {
    constructor() {
        this.fitEl = document.getElementById('deckFit');
        this.slides = [...this.fitEl.querySelectorAll('section.slide')];
        this.current = 0; this.presenting = false;
        this.wheelAcc = 0; this.wheelQuiet = null;
        this.buildDots(); this.fit(); this.show(0);
        addEventListener('resize', () => this.fit());
        this.bindKeys(); this.bindWheel(); this.bindClick(); this.bindPresent();
        const h = document.getElementById('playerHint');
        h.classList.add('show'); setTimeout(() => h.classList.remove('show'), 4000);
    }
    fit() { this.fitEl.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; }
    buildDots() {
        const nav = document.getElementById('navDots');
        this.slides.forEach((s, i) => {
            const d = document.createElement('div');
            d.className = 'nav-dot'; d.title = s.dataset.label || `Slide ${i + 1}`;
            d.addEventListener('click', () => this.show(i));
            nav.appendChild(d);
        });
        this.dots = [...nav.children];
    }
    show(i) {
        i = Math.max(0, Math.min(this.slides.length - 1, i));
        this.slides[this.current].classList.remove('current');
        this.current = i;
        const s = this.slides[i];
        s.classList.add('current');
        if (this.presenting) s.querySelectorAll('.shown').forEach(e => e.classList.remove('shown'));
        document.getElementById('progressBar').style.width = ((i + 1) / this.slides.length * 100) + '%';
        document.getElementById('deckPage').textContent = `${i + 1} / ${this.slides.length}`;
        this.dots.forEach((d, k) => d.classList.toggle('active', k === i));
    }
    step() {
        if (this.presenting) {
            const hidden = this.slides[this.current].querySelectorAll('.reveal:not(.shown)');
            if (hidden.length) { hidden[0].classList.add('shown'); return; }
        }
        this.show(this.current + 1);
    }
    back() {
        if (this.presenting) {
            const shown = this.slides[this.current].querySelectorAll('.shown');
            if (shown.length) { shown[shown.length - 1].classList.remove('shown'); return; }
        }
        this.show(this.current - 1);
    }
    bindKeys() {
        document.addEventListener('keydown', e => {
            if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
            if (e.key === 'f' || e.key === 'F') { this.togglePresent(); return; }
            if (['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)) { e.preventDefault(); this.step(); }
            else if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)) { e.preventDefault(); this.back(); }
            else if (e.key === 'Home') { e.preventDefault(); this.show(0); }
            else if (e.key === 'End') { e.preventDefault(); this.show(this.slides.length - 1); }
        });
    }
    bindWheel() {
        addEventListener('wheel', e => {
            if (e.ctrlKey || e.metaKey) return;
            e.preventDefault();
            clearTimeout(this.wheelQuiet);
            this.wheelAcc += e.deltaY;
            this.wheelQuiet = setTimeout(() => {
                if (Math.abs(this.wheelAcc) >= 48) this.wheelAcc > 0 ? this.step() : this.back();
                this.wheelAcc = 0;
            }, 180);
        }, { passive: false });
    }
    bindClick() {
        document.addEventListener('click', e => {
            if (!this.presenting) return;
            if (e.target.closest('a,button,input,textarea,select,.deck-bar,.nav-dots')) return;
            this.step();
        });
    }
    togglePresent() {
        if (this.presenting) {
            this.presenting = false;
            document.body.classList.remove('presenting');
            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
            return;
        }
        this.presenting = true;
        document.body.classList.add('presenting');
        this.slides[this.current].querySelectorAll('.shown').forEach(el => el.classList.remove('shown'));
        document.documentElement.requestFullscreen?.().catch(() => {});
    }
    bindPresent() {
        document.getElementById('presentBtn').addEventListener('click', () => this.togglePresent());
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && this.presenting) {
                this.presenting = false; document.body.classList.remove('presenting');
            }
        });
    }
}
new DeckPlayer();
</script>
</body>
</html>
