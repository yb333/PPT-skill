<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>deck-studio cover</title>
<!-- 尺寸变体渲染（平台规格 648×320 ≤5M）：副本中给 body 追加
     transform:scale(0.675); transform-origin:0 0; top:-46px
     （画布保持 1920×1080，缩放填宽 1296，垂直居中裁切到 640 高），
     node /tmp 渲染脚本 以 1296x640 dsf2 出 2592×1280 后 sips -Z 648。
     1920×1080 全尺寸：直接渲染本文件（1920x1080 dsf2）。 -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #0a1326 0%, #0f2040 46%, #14294f 100%);
    color: #e8eefb;
  }
  .grid {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(148,163,184,.065) 0 1px, transparent 1px 96px),
      repeating-linear-gradient(90deg, rgba(148,163,184,.065) 0 1px, transparent 1px 96px);
    mask-image: radial-gradient(1200px 800px at 62% 46%, #000 30%, transparent 100%);
  }
  .glow-tr, .glow-bl { position: absolute; border-radius: 50%; }
  .glow-tr { width: 1500px; height: 1100px; right: -320px; top: -260px;
    background: radial-gradient(closest-side, rgba(41,112,255,.4), transparent 70%); }
  .glow-bl { width: 1200px; height: 900px; left: -360px; bottom: -420px;
    background: radial-gradient(closest-side, rgba(59,130,246,.22), transparent 70%); }

  /* ── 全幅流线高速路（背景装饰，冻结的流动瞬间）── */
  .highways { position: absolute; inset: 0; }

  /* ── 左侧字标区 ── */
  .lockup { position: absolute; left: 128px; top: 300px; width: 980px; }
  .chip {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 12px 26px; border: 1px solid rgba(96,165,250,.45); border-radius: 999px;
    font-size: 22px; letter-spacing: 5px; color: #93c5fd; font-weight: 600;
    background: rgba(37,99,235,.12);
  }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: #60a5fa;
    box-shadow: 0 0 14px #3b82f6, 0 0 30px rgba(59,130,246,.6); }
  .wordmark { margin-top: 40px; font-size: 172px; font-weight: 900; letter-spacing: -4px;
    line-height: 1.02; white-space: nowrap; }
  .wordmark .a { color: #f1f5f9; text-shadow: 0 6px 40px rgba(2,6,17,.8); }
  .wordmark .b {
    background: linear-gradient(92deg, #93c5fd 0%, #60a5fa 34%, #2563eb 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 10px 42px rgba(37,99,235,.45));
  }
  .subtitle { margin-top: 34px; font-size: 42px; letter-spacing: 14px; color: #cbd5e1; font-weight: 600; }
  .subtitle b { color: #93c5fd; font-weight: 700; }
  .rule { margin-top: 42px; width: 860px; height: 2px;
    background: linear-gradient(90deg, #3b82f6, rgba(59,130,246,.06)); }
  .features { margin-top: 30px; display: flex; gap: 18px; }
  .features span {
    padding: 12px 24px; border-radius: 12px; font-size: 25px; color: #dbeafe; font-weight: 500;
    background: rgba(41,78,180,.34); border: 1px solid rgba(96,165,250,.38); letter-spacing: 1px;
  }
  .footer { position: absolute; left: 130px; bottom: 64px; font-size: 21px;
    letter-spacing: 4px; color: #8291b4; }

  /* ── 右侧主视觉：悬浮的迷你幻灯片 ── */
  .stage { position: absolute; right: 96px; top: 50%; transform: translateY(-50%); width: 700px; height: 800px; }
  .halo { position: absolute; right: -40px; top: 130px; }
  .card-wrap { position: absolute; left: 40px; top: 210px;
    transform: perspective(1600px) rotateY(-16deg) rotateX(3deg) rotateZ(1.6deg); transform-style: preserve-3d; }
  .card {
    width: 620px; height: 349px; border-radius: 18px; position: relative;
    background: linear-gradient(165deg, #14233f 0%, #0f1b36 100%);
    border: 1px solid rgba(147,197,253,.42);
    box-shadow: 0 40px 110px rgba(2,8,23,.85), 0 0 110px rgba(41,112,255,.42),
                inset 0 1px 0 rgba(226,232,240,.18);
    padding: 26px 30px;
  }
  .mini-bar { position: absolute; top: 14px; left: 16px; display: flex; align-items: center; gap: 10px; }
  .mini-bar .menu { display: flex; flex-direction: column; gap: 3px; }
  .mini-bar .menu i { width: 13px; height: 2px; background: #7dd3fc; border-radius: 1px; }
  .mini-bar .play { width: 0; height: 0; border-left: 9px solid #93c5fd;
    border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 4px; }
  .mini-eyebrow { margin-top: 18px; font-size: 14px; letter-spacing: 4px; color: #60a5fa; font-weight: 700; }
  .mini-title { margin-top: 8px; font-size: 27px; font-weight: 800; color: #f1f5f9; letter-spacing: 1px; }
  .mini-title em { font-style: normal; color: #60a5fa; }
  .mini-diagram { margin-top: 14px; }
  .mini-progress { position: absolute; left: 30px; right: 30px; bottom: 18px; height: 4px; border-radius: 2px;
    background: rgba(148,163,184,.18); }
  .mini-progress i { position: absolute; left: 0; top: 0; bottom: 0; width: 62%; border-radius: 2px;
    background: linear-gradient(90deg, #2563eb, #60a5fa); box-shadow: 0 0 12px rgba(96,165,250,.8); }

  .card-ghost { position: absolute; left: 40px; top: 210px; width: 620px; height: 349px; border-radius: 18px;
    background: linear-gradient(165deg, #0d1830 0%, #0a1329 100%);
    border: 1px solid rgba(96,165,250,.3);
    box-shadow: 0 30px 80px rgba(2,8,23,.7);
    transform: perspective(1600px) translateZ(-120px) rotateY(-16deg) rotateX(3deg) rotateZ(1.6deg) translate(58px, 84px); }

  .callout { position: absolute; display: flex; align-items: center; gap: 12px;
    font-size: 22px; color: #93c5fd; font-weight: 600; letter-spacing: 2px;
    background: rgba(10,20,40,.82); border: 1px solid rgba(96,165,250,.4);
    padding: 12px 22px; border-radius: 12px; backdrop-filter: blur(4px);
    box-shadow: 0 14px 40px rgba(2,8,23,.6); }
  .callout .pin { width: 8px; height: 8px; border-radius: 50%; background: #60a5fa;
    box-shadow: 0 0 12px #3b82f6; flex: none; }
  .co1 { right: -6px; top: 118px; }
  .co2 { left: -30px; bottom: 96px; }

  .vignette { position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 340px rgba(3,9,20,.55); }
</style>
</head>
<body>
  <div class="glow-tr"></div>
  <div class="glow-bl"></div>
  <div class="grid"></div>

  <!-- 背景流线：两条横贯画布的光轨 + 一条入卡连接线（冻结的流动瞬间） -->
  <svg class="highways" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
    <defs>
      <linearGradient id="hg1" x1="0" y1="980" x2="1920" y2="620" gradientUnits="userSpaceOnUse">
        <stop stop-color="#1d4ed8" stop-opacity="0"/>
        <stop offset=".45" stop-color="#3b82f6" stop-opacity=".55"/>
        <stop offset="1" stop-color="#60a5fa" stop-opacity=".1"/>
      </linearGradient>
      <linearGradient id="hg2" x1="0" y1="240" x2="1500" y2="150" gradientUnits="userSpaceOnUse">
        <stop stop-color="#2563eb" stop-opacity="0"/>
        <stop offset=".6" stop-color="#3b82f6" stop-opacity=".3"/>
        <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="link" x1="1060" y1="560" x2="1290" y2="470" gradientUnits="userSpaceOnUse">
        <stop stop-color="#2563eb"/>
        <stop offset="1" stop-color="#93c5fd"/>
      </linearGradient>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </defs>

    <path d="M -80 960 C 420 880, 760 1010, 1180 820 C 1560 650, 1760 560, 2040 520"
          stroke="url(#hg1)" stroke-width="3"/>
    <path d="M -80 960 C 420 880, 760 1010, 1180 820 C 1560 650, 1760 560, 2040 520"
          stroke="#93c5fd" stroke-width="4.5" stroke-linecap="round"
          stroke-dasharray="120 2600" stroke-dashoffset="-980" filter="url(#soft)" opacity=".9"/>
    <path d="M -80 960 C 420 880, 760 1010, 1180 820 C 1560 650, 1760 560, 2040 520"
          stroke="#e0f2fe" stroke-width="4.5" stroke-linecap="round"
          stroke-dasharray="120 2600" stroke-dashoffset="-980"/>

      <path d="M -60 300 C 380 190, 820 330, 1420 160" stroke="url(#hg2)" stroke-width="2.5"/>

    <!-- 字标 → 迷你幻灯片 的入卡流线（亮、带箭头，落点贴卡片左缘） -->
    <path d="M 1070 640 C 1130 632, 1170 600, 1224 545" stroke="url(#link)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 1214 548 L 1232 540 L 1222 558 Z" fill="#93c5fd"/>
    <circle cx="1224" cy="545" r="8" fill="#bfdbfe"/>
    <circle cx="1224" cy="545" r="20" fill="#3b82f6" opacity=".4" filter="url(#soft)"/>
  </svg>

  <!-- 左侧字标 -->
  <div class="lockup">
    <div class="chip"><span class="dot"></span>SKILL · HTML PRESENTATION · 2026</div>
    <div class="wordmark"><span class="a">deck</span><span class="b">-studio</span></div>
    <div class="subtitle">HTML <b>演示工作室</b></div>
    <div class="rule"></div>
    <div class="features">
      <span>单文件零依赖</span><span>流线动画引擎</span><span>机器门禁</span><span>一键可编辑 PPTX</span>
    </div>
  </div>
  <div class="footer">ENGINE 1.6.1 · 固定画布 1920 × 1080 · BROWSE / PRESENT 双模式</div>

  <!-- 右侧主视觉 -->
  <div class="stage">
    <svg class="halo" width="820" height="820" viewBox="0 0 820 820" fill="none">
      <circle cx="410" cy="410" r="372" stroke="#3b82f6" stroke-opacity=".34"
              stroke-width="1.8" stroke-dasharray="4 14"/>
      <circle cx="410" cy="410" r="330" stroke="#60a5fa" stroke-opacity=".16" stroke-width="1.2"/>
      <path d="M 410 38 A 372 372 0 0 1 762 470" stroke="#93c5fd" stroke-opacity=".9"
            stroke-width="4.5" stroke-linecap="round" filter="url(#soft)"/>
      <path d="M 410 38 A 372 372 0 0 1 762 470" stroke="#e0f2fe" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="762" cy="470" r="9" fill="#bfdbfe"/>
      <circle cx="762" cy="470" r="22" fill="#3b82f6" opacity=".4" filter="url(#soft)"/>
    </svg>

    <div class="card-ghost"></div>
    <div class="card-wrap">
      <div class="card">
        <div class="mini-bar"><span class="menu"><i></i><i></i><i></i></span><span class="play"></span></div>
        <div class="mini-eyebrow">DECK PIPELINE</div>
        <div class="mini-title">从大纲到<em>可编辑 PPTX</em></div>
        <svg class="mini-diagram" width="560" height="176" viewBox="0 0 560 176" fill="none">
          <defs>
            <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
              <stop stop-color="#1e3a8a"/><stop offset="1" stop-color="#172554"/>
            </linearGradient>
            <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0 0 L8 4 L0 8 Z" fill="#60a5fa"/>
            </marker>
          </defs>
          <!-- 连线（箭头住在线上）：大纲→生成→门禁→PPTX -->
          <path d="M 108 62 H 142" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>
          <path d="M 248 62 H 290" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>
          <path d="M 396 62 H 442" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>
          <!-- 回路：门禁打回人手微调 → 回到生成 -->
          <path d="M 370 86 C 370 138, 300 140, 270 140" stroke="#3b82f6" stroke-width="2.5"
                stroke-dasharray="6 6" marker-end="url(#arr)"/>
          <path d="M 166 140 C 116 140, 66 122, 64 92" stroke="#3b82f6" stroke-width="2"
                stroke-dasharray="4 6" opacity=".55" marker-end="url(#arr)"/>
          <!-- 冻结的流线高亮：生成 → 门禁 -->
          <path d="M 248 62 H 290" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"
                stroke-dasharray="26 70" stroke-dashoffset="-12" style="filter: drop-shadow(0 0 6px #60a5fa);"/>
          <!-- 节点 -->
          <g>
            <rect x="20" y="38" width="88" height="48" rx="10" fill="url(#nodeFill)" stroke="#3b82f6" stroke-opacity=".6"/>
            <text x="64" y="68" text-anchor="middle" font-size="19" fill="#dbeafe" font-family="PingFang SC, sans-serif">大纲</text>
            <rect x="148" y="38" width="100" height="48" rx="10" fill="url(#nodeFill)" stroke="#60a5fa"/>
            <text x="198" y="68" text-anchor="middle" font-size="19" fill="#eff6ff" font-family="PingFang SC, sans-serif" font-weight="600">生成</text>
            <rect x="296" y="38" width="100" height="48" rx="10" fill="url(#nodeFill)" stroke="#3b82f6" stroke-opacity=".6"/>
            <text x="346" y="68" text-anchor="middle" font-size="19" fill="#dbeafe" font-family="PingFang SC, sans-serif">门禁</text>
            <rect x="168" y="116" width="96" height="48" rx="10" fill="#0b1a36" stroke="#3b82f6" stroke-opacity=".4" stroke-dasharray="5 5"/>
            <text x="216" y="146" text-anchor="middle" font-size="18" fill="#93c5fd" font-family="PingFang SC, sans-serif">人手微调</text>
            <rect x="448" y="38" width="92" height="48" rx="10" fill="#1d4ed8" stroke="#93c5fd"
                  style="filter: drop-shadow(0 0 14px rgba(59,130,246,.65));"/>
            <text x="494" y="68" text-anchor="middle" font-size="19" fill="#ffffff" font-family="PingFang SC, sans-serif" font-weight="700">PPTX</text>
          </g>
        </svg>
        <div class="mini-progress"><i></i></div>
      </div>
    </div>

    <div class="callout co1"><span class="pin"></span>溢出 / 密度机器门禁</div>
    <div class="callout co2"><span class="pin"></span>放映 · 流线动画 · 聚光灯</div>
  </div>

  <div class="vignette"></div>
</body>
</html>
