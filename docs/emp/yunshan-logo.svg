<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380">
  <!-- 云山 logo 矢量重绘（蓝色版）：两笔缎带折出山形。依据 docs/emp 模板照片解构；官方图样取得后可整体替换 -->
  <defs>
    <linearGradient id="ys1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc2f6"/><stop offset=".5" stop-color="#4c85e0"/><stop offset="1" stop-color="#2f6fd0"/>
    </linearGradient>
    <linearGradient id="ys2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa3ee"/><stop offset="1" stop-color="#245fc4"/>
    </linearGradient>
    <linearGradient id="ys3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a71d4"/><stop offset="1" stop-color="#1d4fae"/>
    </linearGradient>
  </defs>
  <!-- 右笔：山腰探出 → 右下圆角 → 底带向左 → 上翘卷尾 -->
  <path d="M 374 292
           C 398 314, 420 340, 428 356
           C 436 373, 424 380, 400 378
           L 336 374
           C 314 372, 300 362, 297 348"
        fill="none" stroke="url(#ys2)" stroke-width="27" stroke-linecap="round"/>
  <!-- 左笔：底左斜切尖端 → 顶峰 -->
  <path d="M 224 376 L 326 242" fill="none" stroke="url(#ys1)" stroke-width="31" stroke-linecap="butt"/>
  <!-- 顶峰折角断面 -->
  <path d="M 340 250 L 372 290" fill="none" stroke="url(#ys3)" stroke-width="28" stroke-linecap="butt"/>
</svg>
